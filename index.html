<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화이트펜슬 스터디카페</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1b4332;
  --green-mid:#2d6a4f;
  --border:#e2e0d8;
  --ink3:#9a9a8e;
  --amber:#b45309;
  --amber-bg:#fffbeb;
  --amber-border:#fde68a;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;}

/* ── 최상단 방문자 카운터 ── */
.visit-counter-bar{
  height:28px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background:#f8faf8;
  border-bottom:1px solid #e5e7eb;
  font-size:11px;
  font-weight:700;
  color:#1b4332;
  z-index:101;
}

.visit-counter-bar .counter-label{
  white-space:nowrap;
  letter-spacing:-.03em;
}

.visit-counter-bar img{
  height:20px;
  display:block;
}

/* ── HEADER ── */
.site-header{
  height:36px;background:var(--green);color:#fff;
  padding:0 12px;display:flex;align-items:center;gap:8px;
  flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:100;
}
.site-header img{height:20px;width:20px;object-fit:contain;border-radius:4px;}
.header-title{font-size:12px;font-weight:700;letter-spacing:-.02em;}
.header-sub{font-size:8px;color:#95d5b2;font-family:'DM Mono',monospace;letter-spacing:.06em;margin-top:1px;}

/* ── 상단 탭바 (고객용 5개) ── */
.top-tab-bar{
  height:48px;display:flex;background:#fff;
  border-bottom:2px solid var(--border);flex-shrink:0;z-index:99;
}
.top-tab-btn{
  flex:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;background:none;color:var(--ink3);
  font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;
  border-bottom:3px solid transparent;
  transition:color .15s,border-color .15s,background .15s;
  position:relative;bottom:-2px;padding:0 4px;
  word-break:keep-all;text-align:center;line-height:1.3;
}
.top-tab-btn.active{color:var(--green-mid);border-bottom-color:var(--green-mid);background:#f7fbf8;}

/* ── IFRAME 영역 ── */
.panel-wrap{flex:1;position:relative;overflow:hidden;}
.iframe-panel{position:absolute;inset:0;display:none;}
.iframe-panel.active{display:block;}
.iframe-panel iframe{width:100%;height:100%;border:none;display:block;}

</style>
</head>
<body>

<!-- 최상단 방문자 카운터 -->
<div class="visit-counter-bar">
  <span class="counter-label">방문현황</span>
  <img
    src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fwhitepencil-studycafe.github.io%2FWebsite%2F&label=%EB%B0%A9%EB%AC%B8&icon=people-fill&color=%231b4332&style=flat&tz=Asia%2FSeoul"
    alt="화이트펜슬 방문자 카운터">
</div>

<!-- HEADER -->
<header class="site-header">
  <img src="https://play-lh.googleusercontent.com/aVTlh7-EuRIYzIPrVA1rkLxaMubV22zsVTKxcijMxmoAhuSZuxwP9Aq2pCbuw9EesLRk=w240-h480-rw" alt="화이트펜슬 로고">
  <div>
    <div class="header-title">화이트펜슬 스터디카페</div>
    <div class="header-sub">WHITEPENCIL STUDY CAFÉ</div>
  </div>
</header>

<!-- 상단 탭바 : 고객용 -->
<nav class="top-tab-bar">
  <button class="top-tab-btn active" onclick="switchTop('faq')" id="tab-faq">
    FAQ
  </button>
  <button class="top-tab-btn" onclick="switchTop('calc')" id="tab-calc">
    멤버십·등급할인
  </button>
  <button class="top-tab-btn" onclick="switchTop('voice')" id="tab-voice">
    소통함
  </button>
  <button class="top-tab-btn" onclick="switchTop('refund')" id="tab-refund">
    환불계산기
  </button>
  <button class="top-tab-btn" onclick="switchTop('postit')" id="tab-postit">
    한마디
  </button>
  <button class="top-tab-btn" onclick="switchTop('rank')" id="tab-rank">
    랭킹
  </button>
</nav>

<!-- IFRAME PANELS -->
<div class="panel-wrap">

  <!-- 고객용 -->
  <div class="iframe-panel active" id="panel-faq">
    <iframe src="https://whitepencil.shop/" title="FAQ" loading="lazy"></iframe>
  </div>
  <div class="iframe-panel" id="panel-calc">
    <iframe src="https://yoosangbeom.github.io/whitepencil-membership/" title="멤버십 요금 계산기" loading="lazy"></iframe>
  </div>
  <div class="iframe-panel" id="panel-voice">
    <iframe src="https://yoosangbeom.github.io/whitepencil-voice/" title="화이트펜슬 소통함" loading="lazy"></iframe>
  </div>
  <div class="iframe-panel" id="panel-refund">
    <iframe src="https://yoosangbeom.github.io/refund-calculator/" title="환불 계산기" loading="lazy"></iframe>
  </div>

  <!-- 오늘의 한마디 / 랭킹: 3지점 통합 데이터라 지점 구분 없이 하나씩만 -->
  <div class="iframe-panel" id="panel-postit">
    <iframe data-src="https://script.google.com/macros/s/AKfycbzcKku8quWmaDOQHiVPAoW-iqUAFzusXM9UuDmI7w6tkaHnmWWA3fg9bXTvshMOBk9F/exec?page=postit" title="오늘의 한마디"></iframe>
  </div>
  <div class="iframe-panel" id="panel-rank">
    <iframe data-src="https://script.google.com/macros/s/AKfycbzcKku8quWmaDOQHiVPAoW-iqUAFzusXM9UuDmI7w6tkaHnmWWA3fg9bXTvshMOBk9F/exec?page=rank_only" title="이달의 랭킹"></iframe>
  </div>

</div>


<script>
function loadIframe(panelId) {
  const iframe = document.querySelector('#panel-' + panelId + ' iframe');
  if (iframe && iframe.dataset.src && !iframe.src) {
    iframe.src = iframe.dataset.src;
  }
}

function switchTop(id) {
  document.querySelectorAll('.iframe-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('panel-' + id).classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');

  loadIframe(id);
}

</script>
</body>
</html>
